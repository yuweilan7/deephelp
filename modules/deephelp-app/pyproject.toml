[project]
name = "deephelp-app"
version = "0.1.0"
description = "DeepHelp read-only complaint conversation MVP"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.25,<5",
    "pymilvus==2.6.17",
    "mcp==2.2.0",
    "aiomysql==0.3.2",
    "redis==6.4.0",
    "fasttext-community==0.11.8",
    "jieba==0.42.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deephelp_app"]
