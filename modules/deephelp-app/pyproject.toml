[project]
name = "deephelp-app"
version = "0.1.0"
description = "M01 offline asynchronous application skeleton"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deephelp_app"]
