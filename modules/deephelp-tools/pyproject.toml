[project]
name = "deephelp-tools"
version = "0.1.0"
description = "Explicit DeepHelp learning, demo, probes and frozen evaluation tools"
requires-python = ">=3.14.7,<3.15"
dependencies = ["deephelp-app==0.1.0"]

[tool.uv.sources]
deephelp-app = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deephelp_tools"]

[tool.hatch.build.targets.sdist.force-include]
"../../datasets" = "datasets"
"../../demo/data" = "demo-data"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
