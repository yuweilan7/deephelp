name: offline-python
on:
  push:
  pull_request:
jobs:
  m01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: modules/deephelp-app/frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: modules/deephelp-app/frontend
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv python install 3.14.7
      - run: uv sync --locked --all-packages
      - run: uv run --locked python --version
      - run: uv run --locked ruff check conftest.py modules
      - run: uv run --locked ruff format --check conftest.py modules
      - run: uv run --locked mypy
      - run: uv run --locked pytest
