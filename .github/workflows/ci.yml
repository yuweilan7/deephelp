name: offline-python
on:
  push:
  pull_request:
jobs:
  m01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --locked --all-packages
      - run: uv run --locked ruff check conftest.py modules/deephelp-app
      - run: uv run --locked ruff format --check conftest.py modules/deephelp-app
      - run: uv run --locked mypy
      - run: uv run --locked pytest
