global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: deephelp-app
    static_configs: [{targets: ["127.0.0.1:9464"]}]
  - job_name: deephelp-business
    static_configs: [{targets: ["127.0.0.1:9465"]}]
  - job_name: deephelp-retrieval
    static_configs: [{targets: ["127.0.0.1:9466"]}]
  - job_name: milvus
    metrics_path: /metrics
    static_configs: [{targets: ["127.0.0.1:9091"]}]
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:19092"]}]
