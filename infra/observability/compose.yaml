name: deephelp-observability
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otel/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18888:8888"
    volumes:
      - ./collector.yaml:/etc/otel/config.yaml:ro
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    ports: ["127.0.0.1:13200:3200"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  prometheus:
    image: prom/prometheus:v3.4.2
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d", "--storage.tsdb.retention.size=256MB"]
    restart: unless-stopped
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./data/prometheus:/prometheus
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    ports: ["127.0.0.1:13000:3000"]
    env_file: ./grafana.env
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
