name: deephelp-metrics
services:
  prometheus:
    image: prom/prometheus:v3.4.2
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--web.listen-address=127.0.0.1:19092", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d", "--storage.tsdb.retention.size=256MB"]
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./data/prometheus:/prometheus
    mem_limit: 256m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  grafana:
    image: grafana/grafana:12.0.2
    network_mode: host
    restart: unless-stopped
    env_file: ./grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "13002"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    mem_limit: 384m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
