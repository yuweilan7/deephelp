name: deephelp-postgres-protocol
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    container_name: deephelp-postgres-protocol
    restart: unless-stopped
    environment:
      POSTGRES_USER: deephelp_app
      POSTGRES_DB: deephelp_m25_protocol
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-pass
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./data:/var/lib/postgresql
    secrets:
      - postgres-pass
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deephelp_app -d deephelp_m25_protocol"]
      interval: 5s
      timeout: 3s
      retries: 12
secrets:
  postgres-pass:
    file: ./config/postgres-pass
